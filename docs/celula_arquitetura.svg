<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="960" viewBox="0 0 1700 960" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .t  { font-size: 15px; fill: #1e293b; }
      .ts { font-size: 13px; fill: #475569; }
      .tb { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .th { font-size: 15px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .tl { font-size: 13px; fill: #334155; }
      .seta { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#seta); }
      .tracejada { stroke: #64748b; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1700" height="960" fill="#ffffff"/>

  <!-- Título -->
  <text x="850" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Arquitetura da célula robótica: pilha OT/IT com OPC UA PubSub e AAS</text>
  <text x="850" y="72" text-anchor="middle" class="ts">Estado em 10/11/2026: funcionando de ponta a ponta com dados reais</text>

  <!-- Cabeçalhos das camadas -->
  <text x="165"  y="118" text-anchor="middle" class="th">CAMADA OT</text>
  <text x="540"  y="118" text-anchor="middle" class="th">CAMADA IT (BORDA)</text>
  <text x="1065" y="118" text-anchor="middle" class="th">SERVIDOR DA CÉLULA</text>
  <text x="1540" y="118" text-anchor="middle" class="th">CONSUMIDORES (PC)</text>

  <!-- ===== OT ===== -->
  <rect x="30" y="135" width="270" height="515" rx="12" fill="#fff4e8" stroke="#d9822b" stroke-width="2"/>
  <text x="165" y="168" text-anchor="middle" class="tb">ESP32 OT</text>
  <text x="165" y="190" text-anchor="middle" class="ts">ESP-IDF 6.1 · FreeRTOS</text>
  <text x="165" y="210" text-anchor="middle" class="ts">servidor Modbus RTU (escravo 1)</text>
  <g class="t">
    <rect x="50" y="232" width="230" height="58" rx="8" fill="#ffffff" stroke="#e7b37f"/>
    <text x="165" y="256" text-anchor="middle">Braço com 4 servos</text>
    <text x="165" y="277" text-anchor="middle" class="ts">base, ombro, cotovelo, garra</text>
    <rect x="50" y="300" width="230" height="40" rx="8" fill="#ffffff" stroke="#e7b37f"/>
    <text x="165" y="326" text-anchor="middle">Esteira</text>
    <rect x="50" y="350" width="230" height="58" rx="8" fill="#ffffff" stroke="#e7b37f"/>
    <text x="165" y="374" text-anchor="middle">Sensor HC-SR04</text>
    <text x="165" y="395" text-anchor="middle" class="ts">detecção de peça (&lt; 8 cm)</text>
    <rect x="50" y="418" width="230" height="58" rx="8" fill="#ffffff" stroke="#e7b37f"/>
    <text x="165" y="442" text-anchor="middle">IHM local</text>
    <text x="165" y="463" text-anchor="middle" class="ts">LCD I²C + botões</text>
    <rect x="50" y="486" width="230" height="58" rx="8" fill="#ffffff" stroke="#e7b37f"/>
    <text x="165" y="510" text-anchor="middle">Ciclo pick-and-place</text>
    <text x="165" y="531" text-anchor="middle" class="ts">fases 0 a 5 (automático)</text>
  </g>
  <text x="165" y="580" text-anchor="middle" class="ts">10 holding registers</text>
  <text x="165" y="600" text-anchor="middle" class="ts">(ângulos, esteira, sensor,</text>
  <text x="165" y="620" text-anchor="middle" class="ts">ciclos, fase)</text>
  <text x="165" y="640" text-anchor="middle" class="ts" font-weight="700">sem rede</text>

  <!-- OT -> IT -->
  <path d="M400,380 L300,380" class="seta"/>
  <path d="M300,400 L400,400" class="seta"/>
  <text x="350" y="338" text-anchor="middle" class="tl" font-weight="700">J7</text>
  <text x="350" y="356" text-anchor="middle" class="tl">Modbus RTU</text>
  <text x="350" y="428" text-anchor="middle" class="tl">UART</text>
  <text x="350" y="446" text-anchor="middle" class="tl">115200 8N1</text>
  <text x="350" y="464" text-anchor="middle" class="tl">TX, RX, GND</text>

  <!-- ===== IT ===== -->
  <rect x="400" y="135" width="280" height="515" rx="12" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="168" text-anchor="middle" class="tb">ESP32 IT</text>
  <text x="540" y="190" text-anchor="middle" class="ts">MicroPython · gateway</text>
  <g class="t">
    <rect x="420" y="215" width="240" height="58" rx="8" fill="#ffffff" stroke="#93b4f0"/>
    <text x="540" y="239" text-anchor="middle">Cliente Modbus RTU</text>
    <text x="540" y="260" text-anchor="middle" class="ts">leitura cíclica (~360 ms)</text>
    <rect x="420" y="285" width="240" height="96" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="540" y="310" text-anchor="middle" font-weight="700">Biblioteca OPC UA PubSub</text>
    <text x="540" y="330" text-anchor="middle" class="ts">(contribuição deste trabalho)</text>
    <text x="540" y="350" text-anchor="middle" class="ts">NetworkMessage JSON</text>
    <text x="540" y="369" text-anchor="middle" class="ts">IEC 62541-14 · DataValue + timestamp</text>
    <rect x="420" y="393" width="240" height="40" rx="8" fill="#ffffff" stroke="#93b4f0"/>
    <text x="540" y="419" text-anchor="middle">Cliente MQTT</text>
    <rect x="420" y="445" width="240" height="58" rx="8" fill="#ffffff" stroke="#93b4f0"/>
    <text x="540" y="469" text-anchor="middle">Displays de estado</text>
    <text x="540" y="490" text-anchor="middle" class="ts">LCD + Nokia 5110</text>
    <rect x="420" y="515" width="240" height="40" rx="8" fill="#ffffff" stroke="#93b4f0"/>
    <text x="540" y="541" text-anchor="middle">Relógio por NTP</text>
  </g>
  <text x="540" y="590" text-anchor="middle" class="ts">PublisherId</text>
  <text x="540" y="610" text-anchor="middle" class="ts">urn:uea:celula-robotica:esp32-it</text>
  <text x="540" y="630" text-anchor="middle" class="ts">DataSetWriterId 2000</text>

  <!-- IT -> RPi -->
  <text x="760" y="340" text-anchor="middle" class="tl" font-weight="700">Wi-Fi</text>
  <text x="760" y="358" text-anchor="middle" class="tl">MQTT · OPC UA</text>
  <text x="760" y="376" text-anchor="middle" class="tl">PubSub JSON</text>
  <text x="760" y="394" text-anchor="middle" class="tl">~2,8 msg/s</text>
  <text x="760" y="440" text-anchor="middle" class="ts">it/opcua/</text>
  <text x="760" y="457" text-anchor="middle" class="ts">celula_robotica</text>

  <!-- Roteador -->
  <rect x="520" y="695" width="480" height="62" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="760" y="721" text-anchor="middle" class="t" font-weight="700">Roteador Wi-Fi da célula · SSID OPC_UA</text>
  <text x="760" y="743" text-anchor="middle" class="ts">192.168.0.1 · rede isolada, sem internet</text>
  <path d="M540,650 L540,695" class="tracejada"/>
  <path d="M980,650 L980,695" class="tracejada"/>

  <!-- ===== RPi 5 ===== -->
  <rect x="820" y="135" width="490" height="515" rx="12" fill="#ebfaef" stroke="#16a34a" stroke-width="2"/>
  <text x="1065" y="168" text-anchor="middle" class="tb">Raspberry Pi 5 "AAS"</text>
  <text x="1065" y="190" text-anchor="middle" class="ts">Debian 13 · wlan0 192.168.0.2 · eth0 169.254.14.189</text>

  <rect x="840" y="373" width="160" height="80" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="920" y="405" text-anchor="middle" class="t" font-weight="700">Mosquitto</text>
  <text x="920" y="427" text-anchor="middle" class="ts">broker MQTT :1883</text>
  <path d="M680,413 L840,413" class="seta"/>

  <rect x="1040" y="210" width="250" height="64" rx="8" fill="#ffffff" stroke="#86d19e"/>
  <text x="1165" y="236" text-anchor="middle" class="t" font-weight="700">aas-gateway (Python)</text>
  <text x="1165" y="257" text-anchor="middle" class="ts">BaSyx SDK · atualiza 1x/s</text>

  <rect x="1040" y="300" width="250" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1165" y="325" text-anchor="middle" class="t" font-weight="700">Eclipse BaSyx (Docker)</text>
  <text x="1165" y="346" text-anchor="middle" class="ts">AAS Environment :8081 (Part 2)</text>
  <text x="1165" y="365" text-anchor="middle" class="ts">Registros AAS / Submodel</text>
  <text x="1165" y="384" text-anchor="middle" class="ts">AAS Web UI :3000</text>
  <line x1="1060" y1="396" x2="1270" y2="396" stroke="#cbe8d3"/>
  <text x="1165" y="415" text-anchor="middle" class="ts">Submodelos: Nameplate,</text>
  <text x="1165" y="434" text-anchor="middle" class="ts">OperationalData, OPCUAPubSubInfo</text>

  <rect x="1040" y="476" width="250" height="64" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="1165" y="502" text-anchor="middle" class="t" font-weight="700">Node-RED :1880</text>
  <text x="1165" y="523" text-anchor="middle" class="ts">flow da célula + dashboard</text>

  <rect x="1040" y="566" width="250" height="64" rx="8" fill="#ffffff" stroke="#86d19e"/>
  <text x="1165" y="592" text-anchor="middle" class="t" font-weight="700">chrony (NTP)</text>
  <text x="1165" y="613" text-anchor="middle" class="ts">hora para o ESP32 IT</text>

  <path d="M920,373 L920,242 L1040,242" class="seta"/>
  <path d="M1165,274 L1165,300" class="seta"/>
  <path d="M920,453 L920,508 L1040,508" class="seta"/>
  <text x="928" y="300" class="ts">assina</text>
  <text x="928" y="485" class="ts">assina</text>
  <text x="1180" y="292" class="ts">REST</text>

  <!-- RPi -> PC -->
  <path d="M1310,330 L1410,330" class="seta"/>
  <path d="M1310,470 L1410,470" class="seta"/>
  <path d="M1410,598 L1290,598" class="tracejada" marker-end="url(#seta)"/>
  <text x="1360" y="300" text-anchor="middle" class="tl" font-weight="700">Ethernet</text>
  <text x="1360" y="318" text-anchor="middle" class="tl">HTTP / REST</text>
  <text x="1360" y="458" text-anchor="middle" class="tl">MQTT</text>
  <text x="1360" y="588" text-anchor="middle" class="tl">NTP</text>

  <!-- ===== PC ===== -->
  <rect x="1410" y="135" width="260" height="515" rx="12" fill="#f3f5f8" stroke="#475569" stroke-width="2"/>
  <text x="1540" y="168" text-anchor="middle" class="tb">PC</text>
  <text x="1540" y="190" text-anchor="middle" class="ts">cabo direto 169.254.124.59</text>
  <g class="t">
    <rect x="1428" y="215" width="224" height="96" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1540" y="240" text-anchor="middle">Navegador</text>
    <text x="1540" y="261" text-anchor="middle" class="ts">AAS Web UI (pull)</text>
    <text x="1540" y="280" text-anchor="middle" class="ts">dashboard Node-RED</text>
    <text x="1540" y="299" text-anchor="middle" class="ts">editor Node-RED</text>
    <rect x="1428" y="323" width="224" height="58" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1540" y="347" text-anchor="middle">AASX Package Explorer</text>
    <text x="1540" y="368" text-anchor="middle" class="ts">arquivo .aasx do AAS</text>
    <rect x="1428" y="441" width="224" height="58" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1540" y="465" text-anchor="middle">Prosys OPC UA Browser</text>
    <text x="1540" y="486" text-anchor="middle" class="ts">assina o PubSub (push)</text>
    <rect x="1428" y="566" width="224" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1540" y="592" text-anchor="middle">w32time (NTP)</text>
    <text x="1540" y="613" text-anchor="middle" class="ts">sincroniza com a.ntp.br</text>
  </g>

  <!-- Notas -->
  <g class="t">
    <text x="40" y="815" font-weight="700">Princípios de projeto</text>
    <text x="40" y="843">• Separação OT/IT: o controlador OT não tem rede; só fala Modbus RTU com o gateway pelo conector J7.</text>
    <text x="40" y="868">• Fluxo somente de leitura: nenhum consumidor de TI envia comandos ao braço.</text>
    <text x="40" y="893">• Desacoplamento: AAS, Node-RED e Prosys consomem a mesma mensagem OPC UA PubSub, sem adaptação no publicador.</text>
    <text x="40" y="918">• Push e pull: eventos via MQTT (Node-RED, Prosys) e consulta sob demanda via API REST do AAS (BaSyx, AAS Part 2).</text>
  </g>
</svg>

# Eclipse BaSyx (AAS Part 2 API) da célula, tudo em memória.
# O aas-gateway (systemd) recria o AAS ao iniciar e atualiza o submodelo OperationalData.
# Subir: cd ~/basyx && docker compose up -d
# Web UI: http://169.254.14.189:3000 (pelo cabo)
x-registry: &registry
  restart: unless-stopped
  volumes:
    - ./registry.yml:/workspace/config/application.yml:ro

services:
  aas-env:
    image: eclipsebasyx/aas-environment:2.0.0-milestone-16
    container_name: aas-env
    restart: unless-stopped
    volumes:
      - ./aas-env.properties:/application/application.properties:ro
    ports:
      - "8081:8081"
    depends_on: [aas-registry, sm-registry]

  aas-registry:
    <<: *registry
    image: eclipsebasyx/aas-registry-log-mem:2.0.0-milestone-16
    container_name: aas-registry
    ports:
      - "8082:8080"

  sm-registry:
    <<: *registry
    image: eclipsebasyx/submodel-registry-log-mem:2.0.0-milestone-16
    container_name: sm-registry
    ports:
      - "8083:8080"

  aas-web-ui:
    image: eclipsebasyx/aas-gui:v2-261013
    container_name: aas-web-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Endereços vistos pelo NAVEGADOR (PC pelo cabo), não pelos containers
    environment:
      AAS_REGISTRY_PATH: "http://169.254.14.189:8082/shell-descriptors"
      SUBMODEL_REGISTRY_PATH: "http://169.254.14.189:8083/submodel-descriptors"
      AAS_REPO_PATH: "http://169.254.14.189:8081/shells"
      SUBMODEL_REPO_PATH: "http://169.254.14.189:8081/submodels"
      CD_REPO_PATH: "http://169.254.14.189:8081/concept-descriptions"
    depends_on: [aas-env]

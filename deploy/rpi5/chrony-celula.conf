# /etc/chrony/conf.d/celula.conf (RPi 5 "AAS")
# Referência de hora da célula: o PC pelo cabo (eth0, link-local).
# Sem internet no wlan0, o pool do Debian fica inalcançável e o PC passa a ser a única fonte.
server 169.254.124.59 iburst prefer minpoll 4 maxpoll 6

# Aceita o PC mesmo se ele estiver sem internet (o w32time anuncia dispersão de 10 s
# e o padrão do chrony recusa > 3 s): o importante é PC, RPi e ESP32 alinhados entre si.
maxdistance 16

# Se o PC estiver desligado, o RPi continua servindo a própria hora aos ESP32
# (estrato alto, para qualquer fonte real ter prioridade).
local stratum 10

# Serve a hora aos ESP32 na rede da célula (wlan0, roteador OPC_UA)
allow 192.168.0.0/24

# /etc/mosquitto/conf.d/celula.conf
# Mosquitto 2.x só escuta em localhost por padrão: abre a 1883 em todas as
# interfaces (wlan0 = rede da célula, eth0 = cabo do PC).
listener 1883 0.0.0.0

# Fase de testes: sem usuário/senha. Trocar por password_file antes de
# expor o broker fora da rede da célula.
allow_anonymous true
